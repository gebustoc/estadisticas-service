apiVersion: v1
kind: Service
metadata:
  name: estadisticas-service
  labels:
    app: estadisticas-service
spec:
  # ClusterIP = solo accesible DENTRO del clúster.
  # Otros servicios lo alcanzan vía DNS interno: http://products-service:8001
  type: ClusterIP
  selector:
    app: estadisticas-service
  ports:
    - name: stats-ext
      protocol: TCP
      port: 3002        # puerto del Service (DNS interno)
      targetPort: 3002  # puerto del contenedor